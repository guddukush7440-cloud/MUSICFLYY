<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MUSICFLYY</title>
<style>
:root{--bg:#fff;--bg2:#f2f2f7;--tx:#1c1c1e;--tx2:#8e8e93;--ac:#fa2d6c;--ac2:#ff7a3d}
@media(prefers-color-scheme:dark){:root{--bg:#000;--bg2:#1c1c1e;--tx:#f5f5f7}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,"Helvetica Neue",Roboto,Arial,sans-serif}
body{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px calc(env(safe-area-inset-bottom,0px) + 18px)}
button{font:inherit;color:inherit;background:none;border:0}
.brand{display:flex;align-items:center;gap:10px}
.brand span{font-weight:800;font-size:20px;letter-spacing:1px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:30px;font-weight:800;margin:14px 0 10px}
#pwrap{aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#111;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#pwrap iframe{width:100%;height:100%}
#now{margin:12px 0 4px;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:5px;border-radius:3px;background:var(--bg2);margin:8px 0 4px}.bar i{display:block;height:100%;width:0;border-radius:3px;background:var(--ac)}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--tx2)}
.ctrl{display:flex;justify-content:center;align-items:center;gap:34px;margin:6px 0 10px}
.ctrl svg{width:30px;height:30px;fill:var(--tx)}.ctrl .pp svg{width:52px;height:52px}
.add{display:flex;gap:8px;margin:8px 0}
input{flex:1;min-width:0;padding:11px 14px;border-radius:12px;border:0;background:var(--bg2);color:var(--tx);font-size:16px}
.go{padding:0 16px;border-radius:12px;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;font-weight:700}
.t{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;text-align:left;border-bottom:1px solid var(--bg2)}
.t img{width:56px;height:42px;object-fit:cover;border-radius:6px}.t b{flex:1;font-weight:500;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t.on b{color:var(--ac)}.del{color:var(--tx2);padding:6px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px 0 4px;scrollbar-width:none}.chip{flex:none;padding:7px 14px;border-radius:16px;background:var(--bg2);font-size:14px;font-weight:600}.chip.on{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff}
.note{font-size:12px;color:var(--tx2);margin-top:14px;line-height:1.5}
</style></head><body>
<div class="brand"><svg width="34" height="34" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fa2d6c"/><stop offset="1" stop-color="#ff7a3d"/></linearGradient></defs><rect width="100" height="100" rx="23" fill="url(#g)"/><path d="M30 68V34l40-8v34" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="25" cy="69" r="8" fill="#fff"/><circle cx="65" cy="61" r="8" fill="#fff"/><path d="M12 82c20-8 48-6 76-22" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".6"/></svg><span>MUSICFLYY</span></div>
<h1>Listen Now</h1>
<div id="pwrap"><div id="yt"></div></div>
<div id="now">Add a YouTube link to start</div>
<div class="bar"><i id="pg"></i></div><div class="times"><span id="tc">0:00</span><span id="td">0:00</span></div>
<div class="ctrl">
<button id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6v12L9.5 12z"/></svg></button>
<button class="pp" id="pp" aria-label="Play or pause"><svg viewBox="0 0 24 24" id="ppi"><path d="M8 5v14l11-7z"/></svg></button>
<button id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 6v12l10.5-6z"/></svg></button></div>
<div class="chips" id="chips"></div>
<div class="add"><input id="u" placeholder="Paste YouTube link" autocomplete="off"><button class="go" id="add">Add</button></div>
<div id="list"></div>
<p class="note">Songs play through the official YouTube player, so quality follows YouTube's own limit (about 128–256 kbps). True lossless needs FLAC files or a licensed service.</p>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
const $=id=>document.getElementById(id);
let PL=[{name:"My Songs",songs:[]}],ai=0;
try{const q=JSON.parse(localStorage.getItem("mf2")||"null");if(q&&q.PL&&q.PL.length){PL=q.PL;ai=Math.min(q.ai||0,PL.length-1)}else{const o=JSON.parse(localStorage.getItem("mf")||"[]");if(o.length)PL[0].songs=o}}catch(e){}
let L=PL[ai].songs;
let cur=-1,P=null,ready=false;
const save=()=>{try{localStorage.setItem("mf2",JSON.stringify({PL,ai}))}catch(e){}};
const fmt=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
const vid=u=>{const m=u.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/)||u.match(/^([\w-]{11})$/);return m&&m[1]};
function draw(){chips();$("list").innerHTML=L.length?L.map((s,i)=>`<div class="t${i===cur?" on":""}"><button style="display:flex;flex:1;align-items:center;gap:12px;text-align:left;min-width:0" data-p="${i}"><img src="https://i.ytimg.com/vi/${s.id}/mqdefault.jpg" alt=""><b>${esc(s.t)}</b></button><button class="del" data-d="${i}" aria-label="Remove">✕</button></div>`).join(""):'<p class="note">This playlist is empty. Paste a YouTube link above and tap Add.</p>'}
const esc=x=>String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function chips(){$("chips").innerHTML=PL.map((p,i)=>`<button class="chip${i===ai?" on":""}" data-c="${i}">${esc(p.name)}</button>`).join("")+'<button class="chip" id="newpl">+ New</button>'+(PL.length>1?'<button class="chip" id="delpl">Delete</button>':"")}
$("chips").onclick=e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.c!==undefined){ai=+b.dataset.c;L=PL[ai].songs;cur=-1;save();draw()}
 else if(b.id==="newpl"){const n=(prompt("Playlist name")||"").trim();if(n){PL.push({name:n.slice(0,30),songs:[]});ai=PL.length-1;L=PL[ai].songs;cur=-1;save();draw()}}
 else if(b.id==="delpl"&&confirm("Delete playlist "+PL[ai].name+"?")){PL.splice(ai,1);ai=0;L=PL[0].songs;cur=-1;save();draw()}};
async function add(){const id=vid($("u").value.trim());if(!id){$("u").value="";$("u").placeholder="Not a valid YouTube link";return}
 let t="YouTube video";try{const r=await fetch("https://www.youtube.com/oembed?format=json&url="+encodeURIComponent("https://www.youtube.com/watch?v="+id));t=(await r.json()).title||t}catch(e){}
 L.push({id,t});save();$("u").value="";draw();if(cur<0)play(L.length-1)}
function play(i){if(!L[i])return;cur=i;$("now").textContent=L[i].t;draw();if(ready)P.loadVideoById(L[i].id)}
function onYouTubeIframeAPIReady(){P=new YT.Player("yt",{width:"100%",height:"100%",playerVars:{playsinline:1,rel:0},events:{onReady(){ready=true;if(cur>=0)P.cueVideoById(L[cur].id)},onStateChange(e){const pl=e.data===1;$("ppi").innerHTML=pl?'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>';if(e.data===0)play((cur+1)%L.length)}}})}
window.onYouTubeIframeAPIReady=onYouTubeIframeAPIReady;
setInterval(()=>{if(!ready||!P.getDuration)return;const d=P.getDuration()||0,c=P.getCurrentTime()||0;$("pg").style.width=d?c/d*100+"%":"0";$("tc").textContent=fmt(c);$("td").textContent=fmt(d)},500);
$("add").onclick=add;$("u").onkeydown=e=>{if(e.key==="Enter")add()};
$("pp").onclick=()=>{if(!ready||cur<0)return;P.getPlayerState()===1?P.pauseVideo():P.playVideo()};
$("next").onclick=()=>L.length&&play((cur+1)%L.length);$("prev").onclick=()=>L.length&&play((cur-1+L.length)%L.length);
$("list").onclick=e=>{const p=e.target.closest("[data-p]"),d=e.target.closest("[data-d]");if(p)play(+p.dataset.p);if(d){const i=+d.dataset.d;L.splice(i,1);save();if(i===cur){cur=-1;ready&&P.stopVideo();$("now").textContent="Add a YouTube link to start"}else if(i<cur)cur--;draw()}};
if(L.length){cur=0;$("now").textContent=L[0].t}draw();
</script></body></html>
